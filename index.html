<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tekken Tag Tournament - Arcade</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
#game{width:100%;height:100%}
</style>
</head>
<body>
<div id="game"></div>
<script>
/*
 * Tekken Tag Tournament Arcade
 * Target: Namco System 12 / MAME 0.139-compatible set.
 * The standard EmulatorJS "mame" core is MAME 2003-era and is
 * intentionally not used as the final core for this game.
 */
window.EJS_player="#game";
window.EJS_gameName="tektagt";
window.EJS_gameUrl="./tektagt.zip";
window.EJS_startOnLoaded=false;
window.EJS_backgroundColor="#000000";
window.EJS_backgroundImage="";

/*
 * Final browser build will be supplied by the MAME 2010/WebAssembly
 * build in /core/. Keep this file separate from the ROM archive.
 */
window.EJS_core="mame2010";
window.EJS_pathtodata="./emulatorjs/data/";
</script>
<script src="./emulatorjs/data/loader.js"></script>
</body>
</html>
