name: Build MAME 2010 WebAssembly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.15
          actions-cache-folder: emsdk-cache

      - name: Clone MAME 2010
        run: git clone --depth 1 https://github.com/libretro/mame2010-libretro.git mame2010

      - name: Patch legacy TR1 include for modern Emscripten
        working-directory: mame2010
        run: |
          sed -i 's@#include <tr1/type_traits>@#include <type_traits>@' src/emu/state.h
          sed -i 's/std::tr1::/std::/g' src/emu/state.h
          sed -i 's/#define DEF_NAMESPACE std::tr1/#define DEF_NAMESPACE std/' src/emu/state.h
          sed -i '/int osd_num_processors(void);/a static inline void osd_yield_processor(void) {}' src/osd/retro/retroos.h

      - name: Build MAME 2010 libretro object
        working-directory: mame2010
        run: |
          emmake make platform=emscripten VRENDER=soft PTR64=0 X86_SH2DRC=0 FORCE_DRC_C_BACKEND=1 -j2
          test -f mame2010_libretro.dll

      - name: Convert libretro object to Emscripten bitcode
        working-directory: mame2010
        run: |
          emcc -r mame2010_libretro.dll -o mame2010_libretro_emscripten.bc
          test -f mame2010_libretro_emscripten.bc
          file mame2010_libretro_emscripten.bc

      - name: Clone EmulatorJS RetroArch build system
        run: git clone --depth 1 --branch next https://github.com/EmulatorJS/RetroArch.git retroarch

      - name: Build EmulatorJS-compatible MAME 2010 core
        working-directory: retroarch/emulatorjs
        run: |
          cp ../../mame2010/mame2010_libretro_emscripten.bc .

          python3 - <<'PY'
          p="../Makefile.emulatorjs"
          s=open(p).read()
          dup=" %libretro-common/file/file_path_io.o %libretro-common/file/file_path.o %libretro-common/compat/compat_strcasestr.o %libretro-common/compat/compat_strl.o"

          old='RARCH_OBJ := $(addprefix $(OBJDIR)/,$(OBJ))'
          new='RARCH_OBJ := $(filter-out'+dup+',$(addprefix $(OBJDIR)/,$(OBJ)))'
          assert old in s
          s=s.replace(old,new,1)

          old2='$(TARGET): $(RARCH_OBJ) $(libretro_new) mv_libretro'
          new2='$(TARGET): $(filter-out'+dup+',$(RARCH_OBJ)) $(libretro_new) mv_libretro'
          assert old2 in s
          s=s.replace(old2,new2,1)

          old3='$(Q)$(LD) -o $@ $(RARCH_OBJ) $(libretro_new) $(additional_libs) $(LIBS) $(LDFLAGS)'
          new3='$(Q)$(LD) -o $@ $(filter-out'+dup+',$(RARCH_OBJ)) $(libretro_new) $(additional_libs) $(LIBS) $(LDFLAGS) -Wl,--allow-multiple-definition'
          assert old3 in s
          s=s.replace(old3,new3,1)

          open(p,"w").write(s)
          PY

          grep -n 'RARCH_OBJ :=' ../Makefile.emulatorjs
          grep -n '\$(TARGET):' ../Makefile.emulatorjs | tail -1
          grep -n '\$(Q)\$(LD)' ../Makefile.emulatorjs | tail -1

          emmake ./build-emulatorjs.sh --legacy

      - name: Verify EmulatorJS core package
        run: |
          find retroarch/EmulatorJS/data/cores -maxdepth 1 -type f -name 'mame2010*' -print
          test -f retroarch/EmulatorJS/data/cores/mame2010-wasm.data
          echo "EmulatorJS-compatible MAME 2010 core completed."

      - name: Upload EmulatorJS core
        uses: actions/upload-artifact@v4
        with:
          name: mame2010-emulatorjs-core
          path: retroarch/EmulatorJS/data/cores/mame2010-wasm.data
