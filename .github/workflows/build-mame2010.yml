name: Build MAME 2010 WebAssembly

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.15
          actions-cache-folder: emsdk-cache

      - name: Clone MAME 2010
        run: git clone --depth 1 https://github.com/libretro/mame2010-libretro.git mame2010

      - name: Patch legacy TR1 include for modern Emscripten
        working-directory: mame2010
        run: |
          sed -i 's@#include <tr1/type_traits>@#include <type_traits>@' src/emu/state.h
          sed -i 's/std::tr1::/std::/g' src/emu/state.h
          sed -i 's/#define DEF_NAMESPACE std::tr1/#define DEF_NAMESPACE std/' src/emu/state.h
          grep -n 'type_traits' src/emu/state.h
          sed -i '/int osd_num_processors(void);/a static inline void osd_yield_processor(void) {}' src/osd/retro/retroos.h
          grep -n 'osd_yield_processor' src/osd/retro/retroos.h

      - name: Build Emscripten static core
        working-directory: mame2010
        run: emmake make platform=emscripten VRENDER=soft PTR64=0 X86_SH2DRC=0 FORCE_DRC_C_BACKEND=1 -j2

      - name: Verify core output
        run: |
          echo "Built files:"
          find mame2010 -maxdepth 3 -type f \( -name "*.bc" -o -name "*.dll" -o -name "*.js" -o -name "*.wasm" \) -print
          test -f mame2010/mame2010_libretro.dll
          echo "MAME 2010 Emscripten build completed."

      - name: Upload core build
        uses: actions/upload-artifact@v4
        with:
          name: mame2010-emscripten-bitcode
          path: mame2010/mame2010_libretro.dll
