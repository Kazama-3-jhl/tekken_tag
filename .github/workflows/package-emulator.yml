name: Package working EmulatorJS runtime

on:
  push:
    branches: ["mame2010-build"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture runtime from the LIVE working page
        env:
          LIVE_PAGE: https://pooryafard.com/games/tekken-tag/
          ROM_URL: https://pooryafard.com/games/tekken-tag/tektagt.zip
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "fs/promises";
          import path from "path";

          const baseDir = path.resolve("emulatorjs");
          await fs.rm(baseDir, { recursive: true, force: true });
          await fs.mkdir(baseDir, { recursive: true });

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });

          const responses = new Map();
          const requestUrls = new Set();
          const errors = [];

          page.on("request", request => {
            requestUrls.add(request.url());
          });

          page.on("pageerror", error => {
            errors.push("PAGEERROR " + error.message);
          });

          page.on("console", message => {
            if (message.type() === "error") {
              errors.push("CONSOLE " + message.text());
            }
          });

          page.on("response", async response => {
            try {
              const u = new URL(response.url());
              const ct = (response.headers()["content-type"] || "").toLowerCase();
              const status = response.status();

              if (u.href === process.env.ROM_URL) return;
              if (u.hostname === "pooryafard.com") return;

              const useful =
                ct.includes("javascript") ||
                ct.includes("ecmascript") ||
                ct.includes("css") ||
                ct.includes("wasm") ||
                ct.includes("octet-stream") ||
                ct.includes("json") ||
                ct.includes("application/wasm") ||
                /\.(js|css|wasm|data|json|bin|worker)$/i.test(u.pathname);

              if (!useful || status < 200 || status >= 300) return;

              responses.set(u.href, response);
            } catch {}
          });

          await page.goto(process.env.LIVE_PAGE, {
            waitUntil: "domcontentloaded",
            timeout: 90000
          });

          await page.waitForTimeout(60000);

          try {
            await page.mouse.click(600, 400);
            await page.keyboard.press("ArrowLeft");
            await page.keyboard.press("ArrowRight");
            await page.keyboard.press("Enter");
          } catch {}

          await page.waitForTimeout(30000);

          const manifest = [];
          for (const [url, response] of responses) {
            try {
              const body = await response.body();
              const u = new URL(url);
              const host = u.hostname.replace(/[^a-z0-9.-]/gi, "_");
              const cleanPath = decodeURIComponent(u.pathname)
                .replace(/^\/+/, "")
                .replace(/\.\.+/g, "_");

              const relative = path.join(host, cleanPath || "index");
              const target = path.join(baseDir, relative);

              await fs.mkdir(path.dirname(target), { recursive: true });
              await fs.writeFile(target, body);

              manifest.push({
                url,
                contentType: response.headers()["content-type"] || "",
                bytes: body.length,
                file: relative
              });
            } catch (error) {
              errors.push("SAVEERROR " + url + " :: " + error.message);
            }
          }

          await fs.writeFile(
            path.join(baseDir, "NETWORK-MANIFEST.json"),
            JSON.stringify({ requestUrls: [...requestUrls], captured: manifest, errors }, null, 2)
          );

          await browser.close();

          console.log("Captured:");
          console.log(manifest.map(x => x.file + " :: " + x.bytes + " bytes :: " + x.url).join("\n"));
          console.log("Errors:");
          console.log(errors.join("\n"));
          console.log("Total captured:", manifest.length);

          if (!manifest.some(x => /loader\.js$/i.test(x.url))) {
            throw new Error("loader.js was not captured from the live page");
          }
          if (manifest.length < 3) {
            throw new Error("Too few runtime files were captured; refusing to publish an incomplete package.");
          }
          EOF

          node capture.mjs

      - name: Add local test page
        run: |
          cat > emulatorjs/index.html <<'EOF'
          <!doctype html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1.0">
            <title>Tekken Tag Tournament - Self Hosted</title>
            <style>
              html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
              #game{width:100%;height:100%}
            </style>
          </head>
          <body>
            <div id="game"></div>
            <script>
              EJS_player="#game";
              EJS_gameUrl="../tektagt.zip";
              EJS_core="mame0.243";
              EJS_gameName="Tekken Tag Tournament";
              EJS_startOnLoaded=true;
            </script>
            <script src="./www.emulatorjs.com/loader.js"></script>
          </body>
          </html>
          EOF

          cat > emulatorjs/README.txt <<'EOF'
          Runtime package captured from the currently working Tekken Tag page:
            https://pooryafard.com/games/tekken-tag/

          It intentionally excludes tektagt.zip.

          The package contains the runtime requests observed while the page
          launched successfully with EJS_core="mame0.243".

          Keep the directory structure intact when extracting.
          EOF

      - name: Create ZIP
        run: |
          rm -f tekken-tag-emulator-runtime.zip
          zip -r -9 tekken-tag-emulator-runtime.zip emulatorjs
          echo "ZIP SIZE:"
          ls -lh tekken-tag-emulator-runtime.zip
          echo "ZIP CONTENTS:"
          unzip -l tekken-tag-emulator-runtime.zip | sed -n '1,240p'

      - name: Publish public GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tekken-tag-runtime-2026-09-20
          name: Tekken Tag EmulatorJS Runtime
          body: |
            Self-hosting runtime captured from the working Tekken Tag Tournament Arcade page.

            ROM (tektagt.zip) is intentionally excluded.
          files: tekken-tag-emulator-runtime.zip
          make_latest: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tekken-tag-emulator-runtime
          path: tekken-tag-emulator-runtime.zip
          retention-days: 90
