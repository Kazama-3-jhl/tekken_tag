name: Build self-hosted Tekken Tag runtime

on:
  push:
    branches: ["mame2010-build"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture only EmulatorJS runtime files
        env:
          LIVE_PAGE: https://pooryafard.com/games/tekken-tag/
          ROM_URL: https://pooryafard.com/games/tekken-tag/tektagt.zip
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "fs/promises";
          import path from "path";

          const root = path.resolve("selfhost");
          await fs.rm(root, { recursive: true, force: true });
          await fs.mkdir(root, { recursive: true });

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });
          const saves = [];
          const requestUrls = new Set();
          const errors = [];

          const shouldCapture = url => {
            const u = new URL(url);
            if (u.hostname !== "www.emulatorjs.com") return false;
            if (u.pathname.startsWith("/cdn-cgi/")) return false;
            if (u.pathname.startsWith("/embed/")) return false;
            if (u.pathname.startsWith("/ad.html")) return false;
            if (u.pathname.startsWith("/api/mame0.243")) return true;
            if (u.pathname.startsWith("/worker/")) return true;
            return /\/(loader|emulator|emulatorjs)\.(js|css)$/i.test(u.pathname);
          };

          const targetFor = url => {
            const u = new URL(url);
            const p = u.pathname.replace(/^\//, "");
            if (p.startsWith("api/")) return path.join(root, p);
            if (p.startsWith("worker/")) return path.join(root, p);
            return path.join(root, "runtime", p || "index");
          };

          const saveResponse = async response => {
            try {
              const url = response.url();
              const u = new URL(url);
              const body = await response.body();
              const target = targetFor(url);
              await fs.mkdir(path.dirname(target), { recursive: true });
              await fs.writeFile(target, body);
              return {
                url,
                contentType: response.headers()["content-type"] || "",
                bytes: body.length,
                file: path.relative(root, target)
              };
            } catch (e) {
              errors.push("SAVEERROR " + response.url() + " :: " + e.message);
              return null;
            }
          };

          page.on("request", request => requestUrls.add(request.url()));

          page.on("response", response => {
            try {
              if (!shouldCapture(response.url())) return;
              if (response.status() < 200 || response.status() >= 300) return;
              saves.push(saveResponse(response));
            } catch {}
          });

          page.on("pageerror", e => errors.push("PAGEERROR " + e.message));
          page.on("console", m => {
            if (m.type() === "error") errors.push("CONSOLE " + m.text());
          });

          await page.goto(process.env.LIVE_PAGE, {
            waitUntil: "domcontentloaded",
            timeout: 90000
          });

          await page.waitForTimeout(60000);

          try {
            await page.mouse.click(600, 400);
            await page.keyboard.press("ArrowLeft");
            await page.keyboard.press("ArrowRight");
            await page.keyboard.press("Enter");
          } catch {}

          await page.waitForTimeout(30000);
          const captured = (await Promise.all(saves)).filter(Boolean);

          // Directly fetch the runtime endpoints too, so navigation timing cannot
          // prevent the core/extractor resources from being packaged.
          const directUrls = [
            "https://www.emulatorjs.com/api/mame0.243",
            "https://www.emulatorjs.com/worker/crc32_worker.js",
            "https://www.emulatorjs.com/worker/extractor_worker.js",
            "https://www.emulatorjs.com/worker/extractor.js",
            "https://www.emulatorjs.com/worker/extractor.wasm"
          ];

          for (const url of directUrls) {
            try {
              if (captured.some(x => x.url === url)) continue;
              const response = await page.request.get(url);
              if (!response.ok()) {
                errors.push("DIRECT " + url + " :: HTTP " + response.status());
                continue;
              }
              const body = await response.body();
              const target = targetFor(url);
              await fs.mkdir(path.dirname(target), { recursive: true });
              await fs.writeFile(target, body);
              captured.push({
                url,
                contentType: response.headers()["content-type"] || "",
                bytes: body.length,
                file: path.relative(root, target)
              });
            } catch (e) {
              errors.push("DIRECT " + url + " :: " + e.message);
            }
          }

          const unique = new Map(captured.map(x => [x.file, x]));
          const manifest = [...unique.values()].sort((a,b) => a.file.localeCompare(b.file));

          await fs.writeFile(
            path.join(root, "NETWORK-MANIFEST.json"),
            JSON.stringify({ requestUrls: [...requestUrls], captured: manifest, errors }, null, 2)
          );

          await browser.close();

          console.log(manifest.map(x => x.file + " :: " + x.bytes + " bytes").join("\n"));
          console.log("Errors:\n" + errors.join("\n"));
          console.log("Total:", manifest.length);

          if (!manifest.some(x => /(^|\/)loader\.js$/i.test(x.file))) {
            throw new Error("loader.js missing");
          }
          if (!manifest.some(x => /(^|\/)emulator\.js$/i.test(x.file))) {
            throw new Error("emulator.js missing");
          }
          if (!manifest.some(x => x.url.includes("/api/mame0.243"))) {
            throw new Error("mame0.243 core endpoint was not captured");
          }
          if (!manifest.some(x => x.url.endsWith("/worker/extractor.wasm"))) {
            throw new Error("extractor.wasm was not captured");
          }
          EOF

          node capture.mjs

      - name: Add deployment files
        run: |
          mkdir -p selfhost/games/tekken-tag

          cat > selfhost/games/tekken-tag/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1.0">
            <title>Tekken Tag Tournament - Arcade</title>
            <style>
              html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
              #game{width:100%;height:100%}
            </style>
          </head>
          <body>
            <div id="game"></div>
            <script>
              EJS_player = "#game";
              EJS_gameParentUrl = "";
              EJS_gameUrl = "./tektagt.zip";
              EJS_core = "mame0.243";
              EJS_gameName = "Tekken Tag Tournament";
              EJS_startOnLoaded = true;
              EJS_controlScheme = "mame";
            </script>
            <script src="./runtime/loader.js"></script>
          </body>
          </html>
          EOF

          cat > selfhost/README.txt <<'EOF'
          TEKKEN TAG TOURNAMENT — SELF-HOSTED RUNTIME

          This package is designed to be extracted directly into public_html.
          It intentionally excludes tektagt.zip.

          Required final layout:
            public_html/
              api/mame0.243
              worker/...
              games/tekken-tag/index.html
              games/tekken-tag/runtime/loader.js
              games/tekken-tag/runtime/emulator.js
              games/tekken-tag/runtime/emulatorjs.css
              games/tekken-tag/runtime/svg/icons.svg   (when present)

          Put tektagt.zip beside index.html:
            public_html/games/tekken-tag/tektagt.zip

          The runtime files are captured locally from the working 0.5.56
          configuration and the ads/Cloudflare files from the capture are removed.
          The goal is zero runtime requests to emulatorjs.com.
          EOF

      - name: Test package structure
        run: |
          test -f selfhost/games/tekken-tag/index.html
          test -f selfhost/runtime/loader.js
          test -f selfhost/runtime/emulator.js
          test -f selfhost/api/mame0.243
          test -f selfhost/worker/extractor.wasm
          echo "SELF-HOST PACKAGE CHECK PASSED"
          find selfhost -maxdepth 4 -type f -printf '%p %s bytes\n' | sort

      - name: Create self-host ZIP
        run: |
          rm -f tekken-tag-selfhost-runtime.zip
          (cd selfhost && zip -r -9 ../tekken-tag-selfhost-runtime.zip .)
          ls -lh tekken-tag-selfhost-runtime.zip
          unzip -l tekken-tag-selfhost-runtime.zip | sed -n '1,260p'

      - name: Publish public GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tekken-tag-selfhost-2026-09-20
          name: Tekken Tag Tournament — Self-Hosted Runtime
          body: |
            Self-host package for the working Tekken Tag Tournament Arcade configuration.

            tektagt.zip is intentionally excluded.
            Extract this ZIP into public_html and place tektagt.zip in games/tekken-tag/.
            Runtime/API/worker files are packaged locally; emulatorjs.com ads and Cloudflare files are excluded.
          files: tekken-tag-selfhost-runtime.zip
          make_latest: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tekken-tag-selfhost-runtime
          path: tekken-tag-selfhost-runtime.zip
          retention-days: 90
